
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bird Battle - Slingshot Adventure</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">
        <header class="top-bar">
            <div class="logo">🐦 BIRD BATTLE</div>
            <div class="score-panel">
                <span id="score">SCORE: 0</span>
                <span id="birds">BIRDS: 3</span>
            </div>
        </header>

        <main>
            <canvas id="gameCanvas" width="1000" height="560"></canvas>
        </main>

        <div class="controls">
            <button id="restartBtn">↻ Restart</button>
            <button id="nextBtn">Next Level ➜</button>
        </div>

        <div id="message">Drag the bird backward and release!</div>

        <footer>
            BIRD BATTLE • SLINGSHOT ADVENTURE
        </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="game.js"></script>

</body>
</html>
